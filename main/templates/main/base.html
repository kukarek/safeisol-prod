{% load static %}
{% load main_tags %}

<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}SAFEISOL — Термочехлы и съёмная теплоизоляция{% endblock %}</title>
        <meta name="description" content="{% block meta_description %}Производство съёмных термочехлов SAFEISOL для арматуры, КИПиА, фланцев, турбин. Цена от производителя, расчёт теплопотерь, монтаж, доставка по РФ.{% endblock %}">
        <link type="text/css" href="{% static 'main/css/base.css' %}" rel="stylesheet">
        <link type="text/css" href="{% static 'main/css/catalog.css' %}" rel="stylesheet">
        <link type="text/css" href="{% static 'main/css/carousel.css' %}" rel="stylesheet">
    </head>

    <body>

        {% header %}

        <div class="content">
            {% block content %}
            {% endblock %}
        </div>
    
        {% footer %}

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="{% static 'main/js/base.js' %}"></script>
        <script src="{% static 'main/js/carousel.js' %}"></script>
    </body>


</html>
